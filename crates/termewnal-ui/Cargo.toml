[package]
name = "termewnal-ui"
description = "Pure-Rust native terminal emulator and multi-protocol workspace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "termewnal_ui"
path = "src/lib.rs"

[[bin]]
name = "termewnal"
path = "src/main.rs"

[dependencies]
arboard.workspace = true
chrono.workspace = true
iced.workspace = true
interprocess.workspace = true
notify.workspace = true
notify-debouncer-mini.workspace = true
open.workspace = true
regex.workspace = true
rfd.workspace = true
serde.workspace = true
termewnal-core = { path = "../termewnal-core" }
termewnal-protocols = { path = "../termewnal-protocols" }
termewnal-pty = { path = "../termewnal-pty" }
termewnal-ssh = { path = "../termewnal-ssh" }
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
x11rb.workspace = true
zbus.workspace = true

[build-dependencies]
winresource.workspace = true

[dev-dependencies]
rand.workspace = true
russh.workspace = true
russh-sftp.workspace = true
tempfile.workspace = true
