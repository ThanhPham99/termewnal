[workspace]
resolver = "2"
members = [
    "crates/termewnal-core",
    "crates/termewnal-protocols",
    "crates/termewnal-pty",
    "crates/termewnal-ssh",
    "crates/termewnal-ui",
]

[workspace.package]
version = "1.0.2"
edition = "2024"
rust-version = "1.91"

[workspace.dependencies]
aes-gcm = { version = "0.11", features = ["zeroize"] }
alacritty_terminal = "0.26"
arboard = { version = "3.7", features = ["wayland-data-control"] }
argon2 = { version = "0.6", features = ["zeroize"] }
base64 = "0.22"
chrono = "0.4"
data-encoding = "2.3"
directories = "6.0"
hmac = "0.13"
iced = { version = "0.14", features = ["tokio", "advanced"] }
interprocess = { version = "2.4", features = ["tokio"] }
keyring = "4.2"
keyring-core = "1.1"
notify = { version = "9.0", features = ["tokio"] }
notify-debouncer-mini = { version = "0.8", features = ["tokio"] }
noyalib = "0.0.64"
open = "5.4"
portable-pty = "0.9"
rand = "0.10"
regex = "1.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rfd = "0.17"
russh = "0.65.4"
russh-sftp = "4.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serial2 = "0.2"
sha1 = "0.11"
socket2 = "0.6"
ssh2-config = "0.9"
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1.54", features = ["full"] }
toml = "1.2"
tracing = "0.1"
uuid = { version = "1.29", features = ["v4", "serde"] }
winresource = "0.1"
x11rb = "0.13"
zbus = "5.19"
zeroize = { version = "1.9", features = ["derive"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = 0

[profile.dev.package.argon2]
opt-level = 2

[profile.dev.package.rsa]
opt-level = 2

[profile.dev.package.aes-gcm]
opt-level = 2

[profile.dev.package.sha1]
opt-level = 2

[profile.dev.package.sha2]
opt-level = 2

[profile.dev.package.hmac]
opt-level = 2
